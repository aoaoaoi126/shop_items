<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>新着・値下げ商品一覧</title>
<style>
:root {
  --bg:#f5f5f7; --card:#fff; --text:#1d1d1f; --muted:#6e6e73;
  --line:#dedee3; --accent:#2563eb; --new:#0f766e; --down:#c2410c;
  --positive:#0f8f83; --borderline:#e5ad16; --negative:#d64545;
}
* { box-sizing:border-box; }
body { margin:0; color:var(--text); background:var(--bg); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif; }
button,input,select { font:inherit; }
header { position:static; background:var(--bg); border-bottom:1px solid var(--line); }
.wrap { width:min(1400px,100%); margin:auto; padding:14px 14px 30px; transition:width .18s ease,margin .18s ease; }
h1 { margin:0 0 4px; font-size:22px; }
.sub { margin-bottom:12px; color:var(--muted); font-size:12px; }
.stats { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.stat { flex:0 0 auto; padding:8px 12px; background:#fff; border:1px solid var(--line); border-radius:12px; font-size:13px; }
.filter-panel { margin-top:10px; }
.filter-panel > summary { display:flex; align-items:center; justify-content:space-between; min-height:42px; padding:0 12px; color:#1d4ed8; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:14px; font-weight:800; cursor:pointer; list-style:none; }
.filter-panel > summary::-webkit-details-marker { display:none; }
.filter-panel > summary::after { content:"▼"; margin-left:10px; font-size:12px; transition:transform .18s ease; }
.filter-panel[open] > summary::after { transform:rotate(180deg); }
.controls { display:grid; grid-template-columns:2fr repeat(3,minmax(120px,1fr)); gap:8px; margin-top:8px; }
input,select { width:100%; min-height:42px; padding:0 11px; background:#fff; border:1px solid var(--line); border-radius:10px; font-size:15px; }
.data-actions { display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:9px; }
.export-button { min-height:36px; padding:7px 11px; color:#1d4ed8; background:#eff6ff; border:1px solid #93c5fd; border-radius:9px; font-size:12px; font-weight:800; cursor:pointer; }
.export-note { color:var(--muted); font-size:11px; }
main.wrap { padding-top:16px; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; }
.card { display:flex; flex-direction:column; min-width:0; overflow:hidden; background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:0 2px 7px rgba(0,0,0,.04); }
.card.decision-positive { border-color:rgba(15,143,131,.65); }
.card.decision-borderline { border-color:rgba(229,173,22,.75); }
.card.decision-negative { border-color:rgba(214,69,69,.62); }
.imgbox { position:relative; aspect-ratio:1/1; overflow:hidden; background:#eee; }
.imgbox img { display:block; width:100%; height:100%; object-fit:contain; background:#fff; }
.badges { position:absolute; top:8px; left:8px; display:flex; gap:5px; flex-wrap:wrap; }
.badge { padding:5px 8px; color:#fff; border-radius:999px; font-size:11px; font-weight:700; box-shadow:0 1px 4px rgba(0,0,0,.18); }
.badge.new { background:var(--new); } .badge.down { background:var(--down); } .badge.shop { background:#374151; }
.body { display:flex; flex:1; flex-direction:column; gap:6px; padding:11px; }
.brand { font-size:13px; font-weight:800; }
.title { display:-webkit-box; min-height:56px; overflow:hidden; color:#333; font-size:13px; line-height:1.45; -webkit-line-clamp:3; -webkit-box-orient:vertical; }
.meta { min-height:16px; color:var(--muted); font-size:11px; }
.price-row { display:flex; align-items:flex-end; justify-content:space-between; gap:8px; margin-top:auto; }
.price { font-size:20px; font-weight:900; }
.old { color:var(--muted); font-size:11px; text-decoration:line-through; }
.downamt { color:var(--down); font-size:12px; font-weight:800; }
.copy-title { width:100%; min-height:36px; padding:8px; color:#1d4ed8; background:#eff6ff; border:1px solid #93c5fd; border-radius:10px; font-size:12px; font-weight:800; cursor:pointer; }
.copy-title:hover { background:#dbeafe; }
.signal-row { display:flex; justify-content:center; gap:10px; padding:2px 0; }
.signal-button { display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px; padding:0; color:#fff; border:2px solid transparent; border-radius:50%; font-size:17px; font-weight:900; cursor:pointer; opacity:.54; box-shadow:0 2px 5px rgba(0,0,0,.16); transition:transform .12s ease,opacity .12s ease,border-color .12s ease; }
.signal-button:hover { transform:translateY(-1px); opacity:.86; }
.signal-button.positive { background:var(--positive); }
.signal-button.borderline { color:#3f3200; background:var(--borderline); }
.signal-button.negative { background:var(--negative); }
.signal-button.selected { opacity:1; border-color:#111827; transform:scale(1.08); }
.open { display:block; margin-top:4px; padding:10px 8px; color:#fff; background:var(--accent); border-radius:10px; text-align:center; text-decoration:none; font-weight:800; }
.empty { display:none; padding:50px 12px; color:var(--muted); text-align:center; }
footer { padding-top:20px; color:var(--muted); font-size:11px; line-height:1.5; }
.decision-panel { position:fixed; right:16px; bottom:16px; z-index:50; display:none; width:320px; max-height:calc(100vh - 32px); overflow:auto; padding:13px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 18px 48px rgba(0,0,0,.22); }
.decision-panel.open { display:block; }
.panel-head { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
.panel-chip { display:inline-flex; align-items:center; min-height:26px; padding:4px 9px; color:#fff; border-radius:999px; font-size:12px; font-weight:900; }
.panel-chip.positive { background:var(--positive); } .panel-chip.borderline { color:#3f3200; background:var(--borderline); } .panel-chip.negative { background:var(--negative); }
.panel-close { width:32px; height:32px; padding:0; color:#374151; background:#f3f4f6; border:0; border-radius:50%; font-size:18px; cursor:pointer; }
.panel-title { margin:10px 0 3px; font-size:15px; line-height:1.4; }
.panel-sub { margin:0 0 12px; color:var(--muted); font-size:11px; line-height:1.45; }
.reason-list { display:grid; gap:6px; }
.reason-button { width:100%; padding:8px 9px; color:#1f2937; background:#fff; border:1px solid #d1d5db; border-radius:10px; text-align:left; font-size:12px; line-height:1.45; cursor:pointer; }
.reason-button.selected { color:#111827; background:#eef2ff; border-color:#4f46e5; box-shadow:0 0 0 2px rgba(79,70,229,.12); }
.save-status { min-height:20px; margin-top:11px; color:#4f46e5; font-size:12px; font-weight:800; text-align:center; }
.toast { position:fixed; left:50%; bottom:22px; z-index:80; display:none; padding:10px 14px; color:#fff; background:rgba(17,24,39,.94); border-radius:999px; font-size:12px; font-weight:800; transform:translateX(-50%); }
.toast.show { display:block; }
@media (max-width:720px) {
  .wrap { padding-right:6px; padding-left:6px; } h1 { font-size:19px; }
  .controls { grid-template-columns:1fr 1fr; } .controls .search { grid-column:1/-1; }
  .data-actions { gap:5px; } .export-button { min-height:32px; padding:6px 8px; font-size:10px; } .export-note { width:100%; font-size:9px; }
  .grid { grid-template-columns:repeat(3,minmax(0,1fr)); gap:5px; } .card { border-radius:9px; }
  .badges { top:4px; left:4px; gap:3px; } .badge { max-width:64px; padding:3px 4px; overflow:hidden; font-size:8px; white-space:nowrap; text-overflow:ellipsis; }
  .body { gap:4px; padding:5px; } .brand { overflow:hidden; font-size:10px; white-space:nowrap; text-overflow:ellipsis; }
  .title { min-height:40px; font-size:9.5px; line-height:1.4; -webkit-line-clamp:3; }
  .meta { min-height:12px; overflow:hidden; font-size:8px; white-space:nowrap; text-overflow:ellipsis; }
  .price-row { gap:3px; } .price { font-size:14px; } .old,.downamt { font-size:8px; }
  .copy-title { min-height:28px; padding:5px 3px; border-radius:7px; font-size:8px; line-height:1.2; }
  .signal-row { gap:5px; } .signal-button { width:25px; height:25px; font-size:12px; border-width:1.5px; }
  .open { padding:7px 3px; border-radius:7px; font-size:9px; }
  body.panel-open main.wrap { padding-bottom:72vh; }
  .decision-panel { right:0; bottom:0; left:0; width:100%; max-height:68vh; padding:14px 12px calc(14px + env(safe-area-inset-bottom)); border-right:0; border-bottom:0; border-left:0; border-radius:18px 18px 0 0; }
  .panel-title { font-size:14px; } .reason-button { padding:9px 10px; font-size:11px; } .toast { bottom:12px; font-size:11px; }
}
</style>
</head>

async function sendDecisionToCloud(record,{queueOnFailure=true}={}){
  if(!record?.item_key)return false;

  if(!navigator.onLine){
    if(queueOnFailure)queueForRetry(record);
    return false;
  }

  try{
    await fetch(CLOUD_ENDPOINT,{
      method:'POST',
      mode:'no-cors',
      cache:'no-store',
      redirect:'follow',
      headers:{'Content-Type':'text/plain;charset=UTF-8'},
      body:JSON.stringify(cloudPayload(record)),
      keepalive:true
    });

    delete PENDING_DECISIONS[record.item_key];
    savePendingMap();
    return true;
  }catch(error){
    console.warn('クラウド送信に失敗しました。',error);
    if(queueOnFailure)queueForRetry(record);
    return false;
  }
}

async function retryPendingDecisions(){
  if(!navigator.onLine)return;
  const records=Object.values(PENDING_DECISIONS);
  if(!records.length)return;

  for(const record of records){
    await sendDecisionToCloud(record,{queueOnFailure:false});
  }
  render();
}
async function copyTitle(button){const title=button.closest('.card')?.querySelector('.title')?.textContent.trim()||'';if(!title){alert('コピーするタイトルがありません。');return}const label=button.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(title)}else{const ta=document.createElement('textarea');ta.value=title;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();if(!ok)throw new Error('copy failed')}button.textContent='コピー済み';button.disabled=true;setTimeout(()=>{button.textContent=label;button.disabled=false},1200)}catch(e){window.prompt('タイトルをコピーしてください',title)}}
function openDecisionPanel(key,type){
  clearTimeout(saveTimer);
  saveTimer=null;

  const nextItem=ITEMS_BY_KEY.get(key);
  if(!nextItem||!DECISION_DEFINITIONS[type])return;

  // 別の商品へ移る前に、現在選択中の評価を即時保存する。
  // クラウド送信はバックグラウンドで続くため、2秒待たず次の商品を評価できる。
  if(activeItem&&activeDecision&&selectedReasonCodes.size){
    commitDecision();
  }else if(activeItem){
    closeDecisionPanel();
  }

  el('saveStatus').textContent='';
  activeItem=nextItem;
  activeDecision=type;

  const existing=DECISIONS[key];
  selectedReasonCodes=new Set(
    existing&&existing.decision===type
      ? (existing.reason_codes||[])
      : []
  );

  const def=DECISION_DEFINITIONS[type];
  el('panelChip').className='panel-chip '+type;
  el('panelChip').textContent=def.symbol+' '+def.label;
  el('panelTitle').textContent=[
    activeItem.brand,
    activeItem.title
  ].filter(Boolean).join(' / ');

  el('reasonList').innerHTML=def.reasons.map(
    ([code,text])=>
      `<button class="reason-button ${selectedReasonCodes.has(code)?'selected':''}" `+
      `type="button" data-code="${esc(code)}">`+
      `${esc(code.replace(/[A-Z]/g,''))}. ${esc(text)}</button>`
  ).join('');

  el('decisionPanel').classList.add('open');
  el('decisionPanel').setAttribute('aria-hidden','false');
  document.body.classList.add('panel-open');
}
function closeDecisionPanel(){clearTimeout(saveTimer);saveTimer=null;el('decisionPanel').classList.remove('open');el('decisionPanel').setAttribute('aria-hidden','true');document.body.classList.remove('panel-open');el('saveStatus').textContent='';activeItem=null;activeDecision=null;selectedReasonCodes=new Set()}
function saveAndCloseDecisionPanel(){
  clearTimeout(saveTimer);
  saveTimer=null;
  if(activeItem&&activeDecision&&selectedReasonCodes.size){
    commitDecision();
    return;
  }
  closeDecisionPanel();
}
function scheduleDecisionSave(){clearTimeout(saveTimer);if(!selectedReasonCodes.size){el('saveStatus').textContent='理由を1つ以上選んでください';return}el('saveStatus').textContent='最後の操作から2秒後に保存します…';saveTimer=setTimeout(commitDecision,2000)}
async function commitDecision(){
  if(!activeItem||!activeDecision||!selectedReasonCodes.size)return;

  const key=itemKey(activeItem);
  const def=DECISION_DEFINITIONS[activeDecision];
  const reasonMap=new Map(
    def.reasons.map(([code,displayText,exportText])=>[
      code,
      exportText||displayText
    ])
  );
  const existing=DECISIONS[key];
  const now=new Date().toISOString();
  const codes=[...selectedReasonCodes];

  const record={
    item_key:key,
    decision:activeDecision,
    decision_label:def.label,
    reason_codes:codes,
    reason_texts:codes.map(code=>reasonMap.get(code)||''),
    first_decision_at:existing?.first_decision_at||existing?.first_judged_at||now,
    updated_at:now,
    item:{
      status:activeItem.status??'',
      shop:activeItem.shop??'',
      category:activeItem.category??'',
      brand:activeItem.brand??'',
      title:activeItem.title??'',
      size:activeItem.size??'',
      condition:activeItem.condition??'',
      old_price:activeItem.old_price??null,
      new_price:activeItem.new_price??null,
      price_down:activeItem.price_down??null,
      url:activeItem.url??'',
      image_url:activeItem.image_url??'',
      source_file:activeItem.source_file??'',
      source_date:activeItem.source_date??'',
      missing_fields:activeItem.missing_fields??[]
    }
  };

  DECISIONS[key]=record;
  saveDecisionMap();
  closeDecisionPanel();
  render();
  showToast('端末に保存・クラウドへ送信中…');

  const sent=await sendDecisionToCloud(record);
  render();
  showToast(sent
    ? 'スプレッドシートへ送信しました'
    : '通信できないため端末に保存しました。オンライン時に再送します'
  );
}
function render(){const q=el('q').value.trim().toLowerCase(),date=el('date').value,shop=el('shop').value,status=el('status').value,sort=el('sort').value;let rows=ITEMS.filter(i=>(!q||(String(i.brand)+' '+String(i.title)).toLowerCase().includes(q))&&(!date||i.source_date===date)&&(!shop||i.shop===shop)&&(!status||i.status===status));if(sort==='priceAsc')rows.sort((a,b)=>(a.new_price??Infinity)-(b.new_price??Infinity));if(sort==='priceDesc')rows.sort((a,b)=>(b.new_price??-1)-(a.new_price??-1));if(sort==='downDesc')rows.sort((a,b)=>(b.price_down??-1)-(a.price_down??-1));if(sort==='brand')rows.sort((a,b)=>String(a.brand).localeCompare(String(b.brand),'ja'));el('grid').innerHTML=rows.map(i=>{const key=itemKey(i),encoded=encodeURIComponent(key),saved=DECISIONS[key],cardClass=saved?' decision-'+saved.decision:'',image=i.image_url||NO_IMAGE_DATA_URI,price=yen(i.new_price)||'価格不明',meta=[i.category,i.size,i.condition].filter(Boolean).join(' / ')||'詳細情報なし';return `<article class="card${cardClass}"><div class="imgbox"><img src="${esc(image)}" alt="${esc(i.brand||i.title)}" loading="lazy" onerror="this.onerror=null;this.src=NO_IMAGE_DATA_URI"><div class="badges"><span class="badge ${i.status==='新着'?'new':'down'}">${esc(i.status)}</span><span class="badge shop">${esc(i.shop)}</span></div></div><div class="body"><div class="brand">${esc(i.brand||'ブランド不明')}</div><div class="title">${esc(i.title)}</div><button class="copy-title" type="button" onclick="copyTitle(this)">タイトルをコピー</button><div class="meta">${esc(meta)}</div><div class="price-row"><div><div class="old">${yen(i.old_price)}</div><div class="price">${price}</div></div><div class="downamt">${i.price_down?'−'+yen(i.price_down):''}</div></div><div class="signal-row" aria-label="仕入れ判断"><button class="signal-button positive ${saved?.decision==='positive'?'selected':''}" type="button" data-key="${encoded}" data-decision="positive" title="仕入れ対象">✓</button><button class="signal-button borderline ${saved?.decision==='borderline'?'selected':''}" type="button" data-key="${encoded}" data-decision="borderline" title="迷う・条件次第">?</button><button class="signal-button negative ${saved?.decision==='negative'?'selected':''}" type="button" data-key="${encoded}" data-decision="negative" title="仕入れ対象外">×</button></div><a class="open" href="${esc(i.url)}" target="_blank" rel="noopener">商品ページを開く</a></div></article>`}).join('');el('empty').style.display=rows.length?'none':'block';const n=rows.filter(i=>i.status==='新着').length,d=rows.filter(i=>i.status==='値下げ').length,j=Object.keys(DECISIONS).length;el('stats').innerHTML=`<div class="stat">表示 <b>${rows.length}</b>件</div><div class="stat">新着 <b>${n}</b>件</div><div class="stat">値下げ <b>${d}</b>件</div><div class="stat">セカスト <b>${rows.filter(i=>i.shop==='セカスト').length}</b>件</div><div class="stat">トレファク <b>${rows.filter(i=>i.shop==='トレファク').length}</b>件</div><div class="stat">判断保存 <b>${j}</b>件</div><div class="stat">送信待ち <b>${Object.keys(PENDING_DECISIONS).length}</b>件</div>`}
function flattenDecision(r){const i=r.item||{};return {item_key:r.item_key||'',decision:r.decision||'',decision_label:r.decision_label||'',reason_codes:(r.reason_codes||[]).join('|'),reason_texts:(r.reason_texts||[]).join(' | '),first_decision_at:r.first_decision_at||r.first_judged_at||'',updated_at:r.updated_at||'',status:i.status??'',shop:i.shop??'',category:i.category??'',brand:i.brand??'',title:i.title??'',size:i.size??'',condition:i.condition??'',old_price:i.old_price??'',new_price:i.new_price??'',price_down:i.price_down??'',url:i.url??'',image_url:i.image_url??'',source_file:i.source_file??'',source_date:i.source_date??'',missing_fields:(i.missing_fields||[]).join('|')}}
function downloadText(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function timestampForFilename(){const d=new Date(),p=v=>String(v).padStart(2,'0');return [d.getFullYear(),p(d.getMonth()+1),p(d.getDate()),'_',p(d.getHours()),p(d.getMinutes()),p(d.getSeconds())].join('')}
function exportCsv(){const records=Object.values(DECISIONS).map(flattenDecision);if(!records.length){alert('保存された判断データがありません。');return}const headers=Object.keys(records[0]),quote=v=>'"'+String(v??'').replace(/"/g,'""')+'"',lines=[headers.map(quote).join(','),...records.map(r=>headers.map(h=>quote(r[h])).join(','))];downloadText('仕入れ判断_'+timestampForFilename()+'.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function exportJsonl(){const records=Object.values(DECISIONS);if(!records.length){alert('保存された判断データがありません。');return}downloadText('仕入れ判断_'+timestampForFilename()+'.jsonl',records.map(r=>JSON.stringify(r)).join('\n'),'application/x-ndjson;charset=utf-8')}
function toggleReasonButton(button){
  if(!button)return;
  const code=button.dataset.code;
  if(selectedReasonCodes.has(code)){
    selectedReasonCodes.delete(code);
    button.classList.remove('selected');
  }else{
    selectedReasonCodes.add(code);
    button.classList.add('selected');
  }
  scheduleDecisionSave();
}

el('grid').addEventListener('click',e=>{
  const b=e.target.closest('.signal-button');
  if(b)openDecisionPanel(decodeURIComponent(b.dataset.key),b.dataset.decision);
});

el('reasonList').addEventListener('click',e=>{
  toggleReasonButton(e.target.closest('.reason-button'));
});

document.addEventListener('keydown',e=>{
  if(!el('decisionPanel').classList.contains('open'))return;
  if(e.ctrlKey||e.altKey||e.metaKey)return;

  const number=Number(e.key);
  if(!Number.isInteger(number)||number<1)return;

  const buttons=[...el('reasonList').querySelectorAll('.reason-button')];
  const button=buttons[number-1];
  if(!button)return;

  e.preventDefault();
  toggleReasonButton(button);
});
